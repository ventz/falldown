<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Down</title>
<meta name="description" content="Fall Down, the TI-83 Plus game, ported line by line from the original Z80 source. Play it in your browser.">
<style>
  :root { --bar: 42px; --bg: #2a2c30; --fg: #e3e7dc; --muted: #b0b8a4; }
  html { height: 100%; background: var(--bg); }
  /* Ebitengine fills the body with its canvas and sets body styles inline;
     !important keeps the body (and so the game) below the controls bar. */
  body { margin: var(--bar) 0 0 0 !important; height: calc(100% - var(--bar)) !important; background: var(--bg) !important; color: var(--fg); font: 14px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #status { position: fixed; inset: var(--bar) 0 0 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  /* One compact row, so the game keeps as much of the window as possible. */
  #controls { position: fixed; left: 0; right: 0; top: 0; box-sizing: border-box; padding: 7px 12px; border-bottom: 1px solid #3f434a; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 14px; }
  #controls span { white-space: nowrap; }
  #controls .links { color: var(--muted); }
  /* Keycaps in the LCD's own colors, so the controls read as part of the game. */
  kbd { display: inline-block; min-width: 1.2em; padding: 1px 6px; margin-right: 4px; border: 1px solid #c3cfae; border-bottom: 2px solid #6f7a5f; border-radius: 4px; background: #9ca88a; color: #1c221a; font: 700 14px/1.25 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; }
  a { color: #c8d6ae; }
</style>
</head>
<body>
<div id="status">Loading Fall Down…</div>
<div id="controls" aria-label="Controls">
  <span><kbd>←</kbd><kbd>→</kbd> steer through the gaps</span>
  <span><kbd>Space</kbd> start</span>
  <span><kbd>Tab</kbd> speed (1 is fast)</span>
  <span><kbd>→</kbd> players (title)</span>
  <span><kbd>M</kbd> pause <kbd>O</kbd> resume</span>
  <span><kbd>Esc</kbd> quit</span>
  <span><kbd>F11</kbd> full screen</span>
  <span class="links">2-player: <a href="https://github.com/ventz/falldown/releases/latest">desktop build</a> · <a href="https://github.com/ventz/falldown">source</a></span>
</div>
<script src="wasm_exec.js"></script>
<script>
  // The bar wraps on narrow windows; size the game to whatever is left.
  // This listener is added before Ebitengine's, so the body has its new
  // height by the time the game measures it.
  const controls = document.getElementById("controls");
  const fitBar = () => document.documentElement.style.setProperty("--bar", controls.offsetHeight + "px");
  fitBar();
  addEventListener("resize", fitBar);

  const status = document.getElementById("status");
  const go = new Go();
  const load = WebAssembly.instantiateStreaming
    ? WebAssembly.instantiateStreaming(fetch("falldown.wasm"), go.importObject)
    : fetch("falldown.wasm").then(r => r.arrayBuffer()).then(b => WebAssembly.instantiate(b, go.importObject));
  load.then(result => {
    status.remove();
    go.run(result.instance);
  }).catch(err => {
    status.textContent = "Fall Down couldn't start in this browser: " + err;
  });
</script>
</body>
</html>
